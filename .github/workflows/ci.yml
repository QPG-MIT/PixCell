name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # --locked: the committed uv.lock is the source of truth; a stale lock
      # fails loudly here instead of resolving silently to something else.
      # --extra all: the suite exercises the workbench (marimo) and the
      # tier-0 solver (tidy3d) directly, not just the dev tooling.
      - name: Sync environment
        run: uv sync --locked --extra all

      # Lab-coupled tests (RL Tinker deps, untracked fixtures, chromium)
      # skip with visible reasons on a fresh clone — the suite must be green.
      - name: Run tests
        run: uv run pytest tests/ -q -rs
