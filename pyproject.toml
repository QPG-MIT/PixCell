[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PixCell is the system (what you install); homi is its engine (what you import).
name = "pixcell"
version = "1.0.0"
description = "PixCell: from pixels to PCells — paper figure to verified parametric GDS (engine package: homi)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
keywords = ["photonics", "gds", "gdsfactory", "vlm", "neurosymbolic", "silicon-photonics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    # MCP (Multi-Agent Architecture)
    "mcp>=1.23.1",
    "anthropic>=0.116.0,<1",

    # MJ: PDF extraction and VLM scoring
    "google-genai>=2.10.0,<3",
    "PyMuPDF>=1.28.0",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.1",

    # Michaelangelo: GDS generation
    # PINNED: 9.3x+ has breaking API changes requiring explicit PDK activation
    "gdsfactory==9.20.7",
    "gdstk>=0.9.0",

    # tidy3d (FDTD) lives in the [simulate] extra
    "klayout>=0.30.5",
    # kfactory pulled in by gdsfactory — don't specify separately to avoid conflicts

    # Numerical/Scientific
    "numpy>=2.4.1",
    "scipy>=1.16.3",
    "pandas>=3.0.3,<4",
    "scikit-image>=0.25.2",
    "shapely>=2.1.2",

    # Visualization
    "matplotlib>=3.10.7",
    "ipywidgets>=8.1.8",
    "plotly>=6.8.0",

    # Utilities
    "platformdirs>=4.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.1",
    "rich>=13.9.4",
    "tqdm>=4.67.1",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "networkx>=3.6",
    "trimesh>=4.10.1",
]

[dependency-groups]
# Synced by default (`uv sync`), so a fresh clone can run the suite and the
# workbench without extra flags. CI additionally uses `--extra all`.
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "marimo>=0.23",
    "anywidget>=0.9",
    "pyarrow",
    "datasets",
    "huggingface-hub",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "playwright",
    "pytest-playwright",
]
# Legacy extra from the retired Streamlit explorer surface; unused by current
# code. Kept only so the committed uv.lock stays valid; removal is queued
# together with the next lock regeneration.
app = [
    "streamlit>=1.30.0",
]
workbench = [
    "marimo>=0.23",
    "anywidget>=0.9",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
# Flex tier-1/2 FDTD + tier-0 local mode solves (heavy; cloud is human-gated)
simulate = [
    "tidy3d>=2.8.5",
]
all = [
    "pixcell[app,workbench,api,dev,simulate]",
]

[project.scripts]
# Unified CLI — pixcell (the system name) and homi (the engine name) are the
# same entry point; both stay.
pixcell = "homi.cli:main"
homi = "homi.cli:main"

# Individual MCP servers (for .mcp.json or standalone use)
homi-mj = "gg.servers.entry_points:mj"
homi-michaelangelo = "gg.servers.entry_points:michaelangelo"
homi-jee = "gg.servers.entry_points:jee"
homi-weber = "gg.servers.entry_points:weber"
homi-flex = "gg.servers.entry_points:flex"
homi-pdk = "gg.servers.entry_points:pdk"
homi-raphael = "gg.servers.entry_points:raphael"

# Benchmark
homi-benchmark = "benchmarking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["homi*", "gg*", "benchmarking*", "jee*", "weber*", "flex*", "michaelangelo*"]

[tool.setuptools.package-data]
homi = ["assets/**/*", "briefs/*.md"]
michaelangelo = ["templates/**/*", "reference/**/*", "core/**/*.py"]
gg = ["pdk/builtin/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reproducibility: Tests for reproducibility requirements",
    "photonics_physics: Tests validating photonics physics principles",
    "critic_generated: Tests generated by critic agents during code review",
    "ml_methodology: Tests validating ML/AI methodology standards",
    "deception: Tests detecting mock/fake implementations",
    "paper_code_consistency: Tests validating paper claims match code",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
