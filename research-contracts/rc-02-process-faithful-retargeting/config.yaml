  - id: T1_one_program_four_stacks
    label: "Identical program topology across four versioned stack manifests"
    status: red
    weight: 0.2
    evidence: null
    consumes: [program_source, named_parameters, stack_manifests]
  - id: T2_explicit_3d_geometry
    label: "Full 3D layer-stack geometry emitted and hashed per retarget"
    status: red
    weight: 0.2
    evidence: null
    consumes: [generated_geometry, simulation_inputs]
  - id: T3_preregistered_gates_met
    label: "Preregistered gates met on all four stacks; issuer rerun matches"
    status: red
    weight: 0.2
    evidence: null
    consumes: [preregistration_commit, stack_manifests, simulation_inputs, sparameter_results, task_identifiers]
  - id: T4_audits_recomputed
    label: "Mesh convergence and energy conservation recomputed from shipped fields"
    status: red
    weight: 0.2
    evidence: null
    consumes: [field_records, mesh_audit, conservation_audit]
  - id: T5_control_and_reproduction
    label: "Fixed-geometry control; one rerun script; task ids and cost disclosed"
    status: red
    weight: 0.2
    evidence: null
    consumes: [control_results, rerun_script, task_identifiers, cost_ledger]

claim_boundaries:
  final_claims_allowed: false
  allowed_current_claims:
    - "The contract is published, funded, and claimable."
  blocked_claims:
    - "Process-faithful 3D retargeting has been demonstrated."
    - "Any submitted result constitutes foundry signoff or tape-out readiness."

verification:
